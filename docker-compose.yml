services:
  postgres:
    image: postgres:16-alpine
    container_name: spyboxd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spyboxd
      POSTGRES_USER: spyboxd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spyboxd-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spyboxd -d spyboxd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spyboxd-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://spyboxd:${POSTGRES_PASSWORD:-spyboxd-local}@postgres:5432/spyboxd
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_FRONTEND_API: ${CLERK_FRONTEND_API:-}
      INGESTION_API_TOKEN: ${INGESTION_API_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  rss-poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spyboxd-rss-poller
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://spyboxd:${POSTGRES_PASSWORD:-spyboxd-local}@postgres:5432/spyboxd
      SPYBOXD_RSS_POLL_INTERVAL_SECONDS: ${SPYBOXD_RSS_POLL_INTERVAL_SECONDS:-7200}
      SPYBOXD_RSS_SWEEP_SECONDS: ${SPYBOXD_RSS_SWEEP_SECONDS:-300}
      SPYBOXD_RSS_REQUEST_PAUSE_SECONDS: ${SPYBOXD_RSS_REQUEST_PAUSE_SECONDS:-3}
      SPYBOXD_RSS_MAX_BACKOFF_SECONDS: ${SPYBOXD_RSS_MAX_BACKOFF_SECONDS:-86400}
      SPYBOXD_RSS_BATCH_SIZE: ${SPYBOXD_RSS_BATCH_SIZE:-50}
      SPYBOXD_RSS_USER_AGENT: ${SPYBOXD_RSS_USER_AGENT:-Spyboxd/1.0 (+https://spyboxd.com)}
    depends_on:
      api:
        condition: service_healthy
    command: python -m rss_worker

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    container_name: spyboxd-frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
