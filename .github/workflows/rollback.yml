name: Roll Back Production

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Retained 40-character release SHA, or 'previous'"
        required: true
        default: previous
        type: string
      confirmation:
        description: "Type ROLLBACK to confirm (database migrations are not downgraded)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spyboxd-production-deploy
  queue: max
  cancel-in-progress: false

jobs:
  rollback:
    name: Guarded retained-release rollback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://spyboxd.com
    env:
      ROLLBACK_TARGET: ${{ inputs.target_revision }}
      ROLLBACK_SCRIPT_SHA: ${{ github.sha }}
      ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Monitor runner file and network activity
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact rollback helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ROLLBACK_SCRIPT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify explicit confirmation and target
        run: |
          if [[ "${ROLLBACK_CONFIRMATION}" != "ROLLBACK" ]]; then
            echo "Confirmation must exactly match ROLLBACK" >&2
            exit 64
          fi
          if [[ "${ROLLBACK_TARGET}" != previous ]] \
              && [[ ! "${ROLLBACK_TARGET}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Rollback target must be 'previous' or a lowercase full Git SHA" >&2
            exit 64
          fi

      - name: Establish one pinned IPv4 production SSH connection
        id: production_ssh
        env:
          SSH_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: deploy/production-ssh.sh open

      - name: Activate retained release
        run: |
          timeout --signal=TERM --kill-after=2m 24m \
            deploy/production-ssh.sh run sh -s -- \
              "${ROLLBACK_SCRIPT_SHA}" "${ROLLBACK_TARGET}" <<'REMOTE'
            set -eu
            ROLLBACK_SCRIPT_SHA="$1"
            ROLLBACK_TARGET="$2"

            case "${ROLLBACK_SCRIPT_SHA}" in
              *[!0-9a-f]*|'')
                echo "Invalid rollback script SHA" >&2
                exit 64
                ;;
            esac
            if [ "${#ROLLBACK_SCRIPT_SHA}" -ne 40 ]; then
              echo "Rollback script SHA must contain exactly 40 hexadecimal characters" >&2
              exit 64
            fi

            case "${ROLLBACK_TARGET}" in
              previous)
                ;;
              *[!0-9a-f]*|'')
                echo "Rollback target must be 'previous' or a lowercase full Git SHA" >&2
                exit 64
                ;;
            esac
            if [ "${ROLLBACK_TARGET}" != previous ] && [ "${#ROLLBACK_TARGET}" -ne 40 ]; then
              echo "Rollback target SHA must contain exactly 40 hexadecimal characters" >&2
              exit 64
            fi

            repository_git() {
              git --git-dir=/opt/spyboxd/repository "$@"
            }
            repository_git rev-parse --is-bare-repository >/dev/null
            timeout --signal=TERM --kill-after=15s 2m \
              git --git-dir=/opt/spyboxd/repository fetch \
                --quiet --force --prune origin '+refs/heads/main:refs/remotes/origin/main'
            resolved_script_sha="$(repository_git rev-parse --verify "${ROLLBACK_SCRIPT_SHA}^{commit}")"
            if [ "${resolved_script_sha}" != "${ROLLBACK_SCRIPT_SHA}" ]; then
              echo "Rollback workflow revision is not available on the server" >&2
              exit 1
            fi
            repository_git merge-base --is-ancestor "${ROLLBACK_SCRIPT_SHA}" refs/remotes/origin/main

            rollback_runner="$(mktemp /tmp/spyboxd-rollback.XXXXXX)"
            clerk_validator="$(mktemp /tmp/spyboxd-clerk-validator.XXXXXX)"
            health_validator="$(mktemp /tmp/spyboxd-health-validator.XXXXXX)"
            trap 'rm -f -- "${rollback_runner}" "${clerk_validator}" "${health_validator}"' EXIT
            repository_git show "${ROLLBACK_SCRIPT_SHA}:deploy/rollback.sh" >"${rollback_runner}"
            repository_git show \
              "${ROLLBACK_SCRIPT_SHA}:deploy/validate-clerk-production.py" \
              >"${clerk_validator}"
            repository_git show \
              "${ROLLBACK_SCRIPT_SHA}:deploy/check-runtime-health.py" \
              >"${health_validator}"
            chmod 0700 "${rollback_runner}"
            chmod 0600 "${clerk_validator}"
            chmod 0600 "${health_validator}"
            SPYBOXD_CLERK_VALIDATOR="${clerk_validator}" \
              SPYBOXD_HEALTH_VALIDATOR="${health_validator}" \
              "${rollback_runner}" "${ROLLBACK_TARGET}"
          REMOTE

      - name: Close production SSH and securely remove local key material
        if: always()
        run: |
          if [[ -x deploy/production-ssh.sh ]]; then
            deploy/production-ssh.sh close
          fi
