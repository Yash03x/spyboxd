name: Deploy Production

on:
  workflow_run:
    workflows: [Production CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: spyboxd-production-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Exact-SHA release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production
      url: https://spyboxd.com
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      REMOTE_BUNDLE: /tmp/spyboxd-release-${{ github.event.workflow_run.head_sha }}.tar.gz
      REMOTE_CHECKSUM: /tmp/spyboxd-release-${{ github.event.workflow_run.head_sha }}.tar.gz.sha256

    steps:
      - name: Download exact CI release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spyboxd-release-${{ env.RELEASE_SHA }}
          path: transfer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact release artifact
        run: |
          set -Eeuo pipefail

          artifact_dir="${GITHUB_WORKSPACE}/transfer"
          bundle_name="spyboxd-release-${RELEASE_SHA}.tar.gz"
          checksum_name="${bundle_name}.sha256"
          bundle_path="${artifact_dir}/${bundle_name}"
          checksum_path="${artifact_dir}/${checksum_name}"

          [[ -f "${bundle_path}" && ! -L "${bundle_path}" ]]
          [[ -f "${checksum_path}" && ! -L "${checksum_path}" ]]
          [[ "$(find "${artifact_dir}" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2 ]]
          [[ "$(find "${artifact_dir}" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2 ]]

          read -r expected_hash expected_name extra <"${checksum_path}"
          [[ "${expected_hash}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${expected_name}" == "${bundle_name}" && -z "${extra:-}" ]]
          (
            cd "${artifact_dir}"
            sha256sum --check --strict "${checksum_name}"
          )

      - name: Clear exact remote artifact paths
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: spyboxd-deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 2m
          envs: RELEASE_SHA,REMOTE_BUNDLE,REMOTE_CHECKSUM
          script: |
            set -eu

            case "${RELEASE_SHA}" in
              *[!0-9a-f]*|'') exit 64 ;;
            esac
            [ "${#RELEASE_SHA}" -eq 40 ] || exit 64
            [ "${REMOTE_BUNDLE}" = "/tmp/spyboxd-release-${RELEASE_SHA}.tar.gz" ] || exit 64
            [ "${REMOTE_CHECKSUM}" = "${REMOTE_BUNDLE}.sha256" ] || exit 64
            rm -f -- "${REMOTE_BUNDLE}" "${REMOTE_CHECKSUM}"

      - name: Copy exact release artifact with pinned OpenSSH host identity
        env:
          SSH_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          key_path="${RUNNER_TEMP}/spyboxd-deploy-key"
          known_hosts_path="${RUNNER_TEMP}/spyboxd-known-hosts"
          scanned_hosts_path="${RUNNER_TEMP}/spyboxd-scanned-hosts"

          case "${SSH_HOST}" in
            ''|-*|*[!A-Za-z0-9.-]*)
              echo 'VPS_HOST must be a plain hostname or IPv4 address.' >&2
              exit 64
              ;;
          esac
          [[ "${SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo 'VPS_HOST_FINGERPRINT must be an exact SHA256 fingerprint.' >&2
            exit 64
          }
          [[ -n "${SSH_PRIVATE_KEY}" ]] || {
            echo 'VPS_SSH_KEY is empty.' >&2
            exit 64
          }

          for local_path in "${key_path}" "${known_hosts_path}" "${scanned_hosts_path}"; do
            case "${local_path}" in
              "${RUNNER_TEMP}"/spyboxd-*) ;;
              *) echo 'Refusing an SSH material path outside RUNNER_TEMP.' >&2; exit 64 ;;
            esac
            [[ ! -e "${local_path}" && ! -L "${local_path}" ]] || {
              echo "Refusing to overwrite an existing SSH material path: ${local_path}" >&2
              exit 1
            }
          done

          umask 077
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${key_path}"
          chmod 0600 "${key_path}"
          [[ -s "${key_path}" ]]

          scanned=false
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 "${SSH_HOST}" >"${scanned_hosts_path}" 2>/dev/null \
                && grep -qv '^#' "${scanned_hosts_path}"; then
              scanned=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          [[ "${scanned}" == true ]] || {
            echo 'Could not scan the production SSH host key.' >&2
            exit 1
          }

          matching_keys=0
          while IFS= read -r key_line; do
            case "${key_line}" in
              \#*|'') continue ;;
            esac
            candidate_fingerprint="$(
              printf '%s\n' "${key_line}" | ssh-keygen -lf - -E sha256 | awk '{print $2}'
            )"
            if [[ "${candidate_fingerprint}" == "${SSH_FINGERPRINT}" ]]; then
              printf '%s\n' "${key_line}" >>"${known_hosts_path}"
              ((matching_keys += 1))
            fi
          done <"${scanned_hosts_path}"
          (( matching_keys > 0 )) || {
            echo 'Scanned SSH host keys did not match VPS_HOST_FINGERPRINT.' >&2
            exit 1
          }
          chmod 0600 "${known_hosts_path}"

          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o GlobalKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o IdentityFile="${key_path}"
            -o LogLevel=ERROR
            -o ServerAliveCountMax=3
            -o ServerAliveInterval=10
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${known_hosts_path}"
          )

          copy_with_retries() {
            local source_path="$1" remote_path="$2" attempt
            [[ -f "${source_path}" && ! -L "${source_path}" ]]
            for attempt in 1 2 3; do
              if timeout --signal=TERM --kill-after=15s 15m \
                  scp "${ssh_options[@]}" -- \
                    "${source_path}" "spyboxd-deploy@${SSH_HOST}:${remote_path}"; then
                return 0
              fi
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              fi
            done
            return 1
          }

          copy_with_retries \
            "${GITHUB_WORKSPACE}/transfer/spyboxd-release-${RELEASE_SHA}.tar.gz" \
            "${REMOTE_BUNDLE}"
          copy_with_retries \
            "${GITHUB_WORKSPACE}/transfer/spyboxd-release-${RELEASE_SHA}.tar.gz.sha256" \
            "${REMOTE_CHECKSUM}"

      - name: Securely remove local SSH material
        if: always()
        run: |
          set -Eeuo pipefail

          cleanup_paths=(
            "${RUNNER_TEMP}/spyboxd-deploy-key"
            "${RUNNER_TEMP}/spyboxd-known-hosts"
            "${RUNNER_TEMP}/spyboxd-scanned-hosts"
          )
          for cleanup_path in "${cleanup_paths[@]}"; do
            case "${cleanup_path}" in
              "${RUNNER_TEMP}"/spyboxd-*) ;;
              *) echo 'Refusing an SSH cleanup path outside RUNNER_TEMP.' >&2; exit 64 ;;
            esac
            [[ ! -L "${cleanup_path}" ]] || {
              echo "Refusing to follow an SSH cleanup symlink: ${cleanup_path}" >&2
              exit 1
            }
            if [[ -f "${cleanup_path}" ]]; then
              chmod 0600 "${cleanup_path}"
              shred --force --iterations=1 --zero --remove -- "${cleanup_path}"
            fi
          done

      - name: Release validated commit to Hetzner
        id: activate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: spyboxd-deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 2m
          envs: RELEASE_SHA,REMOTE_BUNDLE,REMOTE_CHECKSUM
          command_timeout: 45m
          script: |
            set -eu

            case "${RELEASE_SHA}" in
              *[!0-9a-f]*|'')
                echo "Invalid release SHA" >&2
                exit 64
                ;;
            esac
            if [ "${#RELEASE_SHA}" -ne 40 ]; then
              echo "Release SHA must contain exactly 40 hexadecimal characters" >&2
              exit 64
            fi
            if [ "${REMOTE_BUNDLE}" != "/tmp/spyboxd-release-${RELEASE_SHA}.tar.gz" ] \
                || [ "${REMOTE_CHECKSUM}" != "${REMOTE_BUNDLE}.sha256" ]; then
              echo "Remote artifact paths do not match the validated release SHA" >&2
              exit 64
            fi

            release_runner=""
            cleanup_activation() {
              if [ -n "${release_runner}" ]; then
                rm -f -- "${release_runner}"
              fi
              rm -f -- "${REMOTE_BUNDLE}" "${REMOTE_CHECKSUM}"
            }
            trap cleanup_activation EXIT

            if [ ! -f "${REMOTE_BUNDLE}" ] || [ -L "${REMOTE_BUNDLE}" ] \
                || [ ! -f "${REMOTE_CHECKSUM}" ] || [ -L "${REMOTE_CHECKSUM}" ]; then
              echo "Transferred release artifact is incomplete or unsafe" >&2
              exit 1
            fi

            checksum_hash="$(awk 'NR == 1 { print $1 }' "${REMOTE_CHECKSUM}")"
            checksum_name="$(awk 'NR == 1 { print $2 }' "${REMOTE_CHECKSUM}")"
            checksum_lines="$(awk 'END { print NR }' "${REMOTE_CHECKSUM}")"
            case "${checksum_hash}" in
              *[!0-9a-f]*|'')
                echo "Remote checksum is invalid" >&2
                exit 1
                ;;
            esac
            if [ "${#checksum_hash}" -ne 64 ] \
                || [ "${checksum_name}" != "$(basename "${REMOTE_BUNDLE}")" ] \
                || [ "${checksum_lines}" -ne 1 ]; then
              echo "Remote checksum does not identify the exact release bundle" >&2
              exit 1
            fi
            (
              cd /tmp
              sha256sum --check --strict "$(basename "${REMOTE_CHECKSUM}")"
            )

            if git --git-dir=/opt/spyboxd/repository rev-parse --is-bare-repository >/dev/null 2>&1; then
              repository_git() {
                git --git-dir=/opt/spyboxd/repository "$@"
              }
            elif git -C /opt/spyboxd rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repository_git() {
                git -C /opt/spyboxd "$@"
              }
            else
              echo "No Spyboxd Git repository found. The first rollout requires the existing /opt/spyboxd checkout." >&2
              exit 1
            fi

            repository_git fetch --quiet --force --prune origin '+refs/heads/main:refs/remotes/origin/main'
            resolved_sha="$(repository_git rev-parse --verify "${RELEASE_SHA}^{commit}")"
            if [ "${resolved_sha}" != "${RELEASE_SHA}" ]; then
              echo "Fetched commit does not match the CI-validated SHA" >&2
              exit 1
            fi
            main_sha="$(repository_git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
            if [ "${main_sha}" != "${RELEASE_SHA}" ]; then
              echo "Skipping stale CI artifact because main now points to ${main_sha}" >&2
              exit 75
            fi

            release_runner="$(mktemp /tmp/spyboxd-release.XXXXXX)"
            repository_git show "${RELEASE_SHA}:deploy/release.sh" >"${release_runner}"
            chmod 0700 "${release_runner}"
            "${release_runner}" "${RELEASE_SHA}" "${REMOTE_BUNDLE}"

      - name: Verify public release from GitHub runner
        id: external_smoke
        run: |
          set -Eeuo pipefail

          api_ready=false
          for _ in {1..15}; do
            if response="$(curl --silent --show-error --fail --max-time 10 \
                --header 'Cache-Control: no-cache' \
                https://api.spyboxd.com/ready 2>/dev/null)" \
                && jq --exit-status --arg expected_revision "${RELEASE_SHA}" \
                  '.status == "ready" and .revision == $expected_revision' \
                  <<<"${response}" >/dev/null
            then
              api_ready=true
              break
            fi
            sleep 2
          done
          [[ "${api_ready}" == true ]]

          frontend_ready=false
          for _ in {1..15}; do
            status_code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 10 \
              --header 'Cache-Control: no-cache' \
              https://spyboxd.com/ 2>/dev/null || true)"
            case "${status_code}" in
              2??)
                frontend_ready=true
                break
                ;;
            esac
            sleep 2
          done
          [[ "${frontend_ready}" == true ]]

      - name: Roll back externally unhealthy activation
        if: always() && steps.activate.outcome == 'success' && steps.external_smoke.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: spyboxd-deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 2m
          envs: RELEASE_SHA
          command_timeout: 10m
          script: |
            set -eu

            case "${RELEASE_SHA}" in
              *[!0-9a-f]*|'') exit 64 ;;
            esac
            [ "${#RELEASE_SHA}" -eq 40 ] || exit 64

            if git --git-dir=/opt/spyboxd/repository rev-parse --is-bare-repository >/dev/null 2>&1; then
              repository_git() {
                git --git-dir=/opt/spyboxd/repository "$@"
              }
            elif git -C /opt/spyboxd rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repository_git() {
                git -C /opt/spyboxd "$@"
              }
            else
              echo "No Spyboxd Git repository is available for rollback" >&2
              exit 1
            fi

            repository_git fetch --quiet --force --prune origin '+refs/heads/main:refs/remotes/origin/main'
            resolved_sha="$(repository_git rev-parse --verify "${RELEASE_SHA}^{commit}")"
            [ "${resolved_sha}" = "${RELEASE_SHA}" ]
            repository_git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/main

            rollback_runner="$(mktemp /tmp/spyboxd-rollback.XXXXXX)"
            trap 'rm -f -- "${rollback_runner}"' EXIT
            repository_git show "${RELEASE_SHA}:deploy/rollback.sh" >"${rollback_runner}"
            chmod 0700 "${rollback_runner}"
            "${rollback_runner}" previous

      - name: Clean exact remote artifact paths
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: spyboxd-deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 2m
          envs: RELEASE_SHA,REMOTE_BUNDLE,REMOTE_CHECKSUM
          script: |
            set -eu

            case "${RELEASE_SHA}" in
              *[!0-9a-f]*|'') exit 64 ;;
            esac
            [ "${#RELEASE_SHA}" -eq 40 ] || exit 64
            [ "${REMOTE_BUNDLE}" = "/tmp/spyboxd-release-${RELEASE_SHA}.tar.gz" ] || exit 64
            [ "${REMOTE_CHECKSUM}" = "${REMOTE_BUNDLE}.sha256" ] || exit 64
            rm -f -- "${REMOTE_BUNDLE}" "${REMOTE_CHECKSUM}"
