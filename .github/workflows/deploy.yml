name: Deploy Production

on:
  workflow_run:
    workflows: [Production CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: spyboxd-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Exact-SHA release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production
      url: https://spyboxd.com
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Release validated commit to Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: RELEASE_SHA
          command_timeout: 45m
          script: |
            set -eu

            case "${RELEASE_SHA}" in
              *[!0-9a-f]*|'')
                echo "Invalid release SHA" >&2
                exit 64
                ;;
            esac
            if [ "${#RELEASE_SHA}" -ne 40 ]; then
              echo "Release SHA must contain exactly 40 hexadecimal characters" >&2
              exit 64
            fi

            if git -C /opt/spyboxd rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repository_git() {
                git -C /opt/spyboxd "$@"
              }
            elif git --git-dir=/opt/spyboxd/repository rev-parse --is-bare-repository >/dev/null 2>&1; then
              repository_git() {
                git --git-dir=/opt/spyboxd/repository "$@"
              }
            else
              echo "No Spyboxd Git repository found. The first rollout requires the existing /opt/spyboxd checkout." >&2
              exit 1
            fi

            repository_git fetch --quiet --force --prune origin '+refs/heads/main:refs/remotes/origin/main'
            resolved_sha="$(repository_git rev-parse --verify "${RELEASE_SHA}^{commit}")"
            if [ "${resolved_sha}" != "${RELEASE_SHA}" ]; then
              echo "Fetched commit does not match the CI-validated SHA" >&2
              exit 1
            fi
            repository_git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/main

            release_runner="$(mktemp /tmp/spyboxd-release.XXXXXX)"
            trap 'rm -f -- "${release_runner}"' EXIT
            repository_git show "${RELEASE_SHA}:deploy/release.sh" >"${release_runner}"
            chmod 0700 "${release_runner}"
            "${release_runner}" "${RELEASE_SHA}"
