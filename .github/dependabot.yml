version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:55"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
